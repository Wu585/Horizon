name: Daily Horizon Summary

on:
  schedule:
    - cron: '15 0 * * *'  # 08:15 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Collect news and generate Chinese digest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          : "${DEEPSEEK_API_KEY:?Add DEEPSEEK_API_KEY to repository Actions secrets}"
          uv run horizon --config data/config.github.json --data-dir "$RUNNER_TEMP/horizon" --hours 24
      - name: Save digest
        uses: actions/upload-artifact@v4
        with:
          name: horizon-digest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/horizon/summaries/
          if-no-files-found: warn
          retention-days: 30
